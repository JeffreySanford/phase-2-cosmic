---
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "data-generator"
    static_configs:
      - targets: ["docker-data-generator-1:9100"]

  # Regional collector tier. Each collector exports
  # collector_messages_forwarded_total{region=...}, which the topology view's
  # per-edge PromQL depends on. Without these jobs that series never exists, so
  # every Pulsar->collector->Kafka edge reports "No measurement" regardless of
  # how much traffic actually flows through it.
  #
  # These run in the separate "geo" compose project and are reachable by service
  # name because that project joins the same external docker_default network.
  # When the geo profile is not running the targets are simply down, and the
  # topology view degrades to "No measurement" as designed.
  - job_name: "pulsar-collector"
    static_configs:
      - targets:
          - "collector-us:9110"
          - "collector-eu:9110"
          - "collector-apac:9110"

  - job_name: "java-ingest"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["java-ingest:8080"]

  - job_name: "java-governance"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["java-governance:8080"]

  - job_name: "frontend-ssr"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:4000"]

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "rabbitmq-exporter"
    static_configs:
      - targets: ["rabbitmq-exporter:9419"]

  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: "pulsar"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["pulsar:8080"]

  - job_name: "minio"
    metrics_path: "/minio/v2/metrics/cluster"
    static_configs:
      - targets: ["minio:9000"]

  - job_name: "nginxlog-exporter"
    static_configs:
      - targets: ["nginxlog-exporter:4040"]

  - job_name: "grafana"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:3000"]

  - job_name: "loki"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:3100"]

  - job_name: "alertmanager"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:9093"]
