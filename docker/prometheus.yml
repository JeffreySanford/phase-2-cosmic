---
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "data-generator"
    static_configs:
      - targets: ["data-generator:9100"]

  - job_name: "java-ingest"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["java-ingest:8080"]

  - job_name: "java-governance"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["java-governance:8080"]

  - job_name: "frontend-ssr"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:4000"]

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "rabbitmq-exporter"
    static_configs:
      - targets: ["rabbitmq-exporter:9419"]

  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: "pulsar"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["pulsar:8080"]

  - job_name: "minio"
    metrics_path: "/minio/v2/metrics/cluster"
    static_configs:
      - targets: ["minio:9000"]

  - job_name: "nginxlog-exporter"
    static_configs:
      - targets: ["nginxlog-exporter:4040"]

  - job_name: "grafana"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:3000"]

  - job_name: "loki"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:3100"]

  - job_name: "alertmanager"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:9093"]
