---
version: '3.8'
services:
  java-governance:
    image: phase2/java-governance:dev
    container_name: java-governance
    ports:
      # Expose host 8082 mapped to container 8080 so the frontend
      # can proxy to localhost:8082.
      - "8082:8080"
    environment:
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379

# To start just the governance container for local dev:
# docker-compose -f docker/infrastructure/docker-compose.dev.yml up --build
