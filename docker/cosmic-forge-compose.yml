---
name: cosmic-forge

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${FORGE_POSTGRES_HOST_PORT:-55432}:5432"
    environment:
      - POSTGRES_DB=${FORGE_POSTGRES_DB:-cosmic_forge}
      - POSTGRES_USER=${FORGE_POSTGRES_USER:-cosmic_forge}
      - POSTGRES_PASSWORD
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "${FORGE_POSTGRES_USER:-cosmic_forge}"
          -d "${FORGE_POSTGRES_DB:-cosmic_forge}"
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - forge-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${FORGE_REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${FORGE_MINIO_API_HOST_PORT:-9001}:9000"
      - "${FORGE_MINIO_CONSOLE_HOST_PORT:-9002}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio}
      - MINIO_ROOT_PASSWORD
    healthcheck:
      test:
        - CMD
        - /usr/bin/mc
        - ready
        - local
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - forge-minio-data:/data

  forge-api:
    build:
      context: ..
      dockerfile: apps/cosmic-forge-api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${FORGE_API_HOST_PORT:-4101}:4101"
    environment:
      NODE_ENV: development
      PORT: 4101
      FORGE_API_HOST_PORT: 4101
      FORGE_REDIS_URL: "redis://redis:6379"
      FORGE_MINIO_ENDPOINT: "http://minio:9000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:4101/health')
          .then((r) => process.exit(r.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10

  forge-worker:
    build:
      context: ..
      dockerfile: apps/cosmic-forge-worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${FORGE_WORKER_HOST_PORT:-4102}:4102"
    environment:
      NODE_ENV: development
      PORT: 4102
      FORGE_WORKER_HOST_PORT: 4102
      FORGE_REDIS_URL: "redis://redis:6379"
      FORGE_MINIO_ENDPOINT: "http://minio:9000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:4102/health')
          .then((r) => process.exit(r.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  forge-postgres-data:
  forge-minio-data:
