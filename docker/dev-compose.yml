---
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "nc"
        - "-z"
        - "localhost"
        - "2181"
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    env_file:
      - ./.env
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      # Two listeners: internal Docker network (PLAINTEXT)
      # and a host-reachable listener (HOST). Names must match
      # the value in KAFKA_LISTENERS.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,HOST://0.0.0.0:9093
      # Advertise the broker on the Compose network and also on the host
      # (host.docker.internal) so host-clients and Testcontainers can reach it.
      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:9092,HOST://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "${KAFKA_HOST_PORT:-9094}:9093"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "echo > /dev/tcp/localhost/9092 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    volumes:
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test:
        - "CMD"
        - "rabbitmq-diagnostics"
        - "status"
      interval: 10s
      timeout: 5s
      retries: 5

  pulsar:
    image: apachepulsar/pulsar:3.2.4
    command:
      - /bin/bash
      - -c
      - bin/pulsar standalone
    ports:
      - "6650:6650"
      - "8085:8080"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:8080/admin/v2/clusters"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:9000/minio/health/live"
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    env_file:
      - ./.env
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--spider"
        - "--quiet"
        - "http://localhost:9090/-/ready"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:9.5.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
      - loki
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:3000/api/health"
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:2.8.2
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:3100/ready"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:9093/-/ready"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  data-generator:
    build:
      context: ../tools/data-generator
      dockerfile: Dockerfile
    image: phase2/data-generator:dev
    # persist logs from the container to host for inspection
    volumes:
      - ../tools/data-generator/logs:/var/lib/data-generator/logs
    ports:
      - "9100:9100"
    environment:
      - DIAG_RUN=false
      # optional: set DIAG_IPERF_TARGET to run iperf3 client when DIAG_RUN=true
      - DIAG_IPERF_TARGET=
    depends_on:
      - kafka
      - prometheus
    restart: unless-stopped

  java-ingest:
    build:
      context: ../tools/java-ingest
      dockerfile: Dockerfile
    image: phase2/java-ingest:dev
    ports:
      - "8081:8080"
    env_file:
      - ./.env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MINIO_ENDPOINT=minio:9000
      - PROMETHEUS_ENDPOINT=prometheus:9090
    depends_on:
      - kafka
      - minio
      - prometheus
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:8080/actuator/health"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  java-governance:
    build:
      context: ..
      dockerfile: docker/java-governance/Dockerfile
    image: phase2/java-governance:dev
    ports:
      - "8082:8080"
    env_file:
      - ./.env
    environment:
      - SPRING_PROFILES_ACTIVE=docker,kafka
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - REDIS_HOST=redis
      - SPRING_REDIS_URL=redis://redis:6379
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - HOST_KAFKA_BOOTSTRAP=kafka:9092
      - PULSAR_ADMIN_URL=http://pulsar:8080
      - PULSAR_SERVICE_URL=pulsar://pulsar:6650
      - PULSAR_BROKER_URL=pulsar://pulsar:6650
      - SPRING_PULSAR_SERVICE_URL=pulsar://pulsar:6650
      - PROMETHEUS_ENDPOINT=prometheus:9090
      - PROMETHEUS_BASEURL=http://prometheus:9090
      - PROMETHEUS_BASE_URL=http://prometheus:9090
      # Ensure JVM system property so Spring reads prometheus.baseUrl
      - JAVA_TOOL_OPTIONS=-Dprometheus.baseUrl=http://prometheus:9090
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:8080/actuator/health"
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "redis-cli"
        - "ping"
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 10s

  nginx-static:
    image: nginx:stable
    ports:
      - "8080:80"
    volumes:
      - ../dist/apps/frontend:/usr/share/nginx/html:ro
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:80/"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  test-runner:
    image: node:20-bullseye
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
      - pnpm-store:/pnpm-store
    depends_on:
      - prometheus
    entrypoint:
      - "/bin/bash"
      - "-lc"
    command: "./scripts/docker-test-runner.sh"
    restart: "no"

networks:
  default:
    driver: bridge

volumes:
  pnpm-store:
    driver: local
  grafana-storage:
    driver: local
  loki-data:
    driver: local
