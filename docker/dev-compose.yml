---
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "nc"
        - "-z"
        - "localhost"
        - "2181"
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "echo > /dev/tcp/localhost/9092 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "rabbitmq-diagnostics"
        - "status"
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:9000/minio/health/live"
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--spider"
        - "--quiet"
        - "http://localhost:9090/-/ready"
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:9.5.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
      - loki
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:3000/api/health"
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:2.8.2
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  data-generator:
    build:
      context: ../tools/data-generator
      dockerfile: Dockerfile
    image: phase2/data-generator:dev
    # persist logs from the container to host for inspection
    volumes:
      - ../tools/data-generator/logs:/var/lib/data-generator/logs
    ports:
      - "9100:9100"
    environment:
      - DIAG_RUN=false
      # optional: set DIAG_IPERF_TARGET to run iperf3 client when DIAG_RUN=true
      - DIAG_IPERF_TARGET=
    depends_on:
      - kafka
      - prometheus
    restart: unless-stopped

  java-ingest:
    build:
      context: ../tools/java-ingest
      dockerfile: Dockerfile
    image: phase2/java-ingest:dev
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MINIO_ENDPOINT=minio:9000
      - PROMETHEUS_ENDPOINT=prometheus:9090
    depends_on:
      - kafka
      - minio
      - prometheus
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:8080/actuator/health"
      interval: 10s
      timeout: 5s
      retries: 5

  java-governance:
    build:
      context: ../apps/java-governance
      dockerfile: Dockerfile
    image: phase2/java-governance:dev
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:8080/actuator/health"
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  nginx-static:
    image: nginx:stable
    ports:
      - "8080:80"
    volumes:
      - ../dist/apps/frontend:/usr/share/nginx/html:ro
    restart: unless-stopped

  test-runner:
    image: node:20-bullseye
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
      - pnpm-store:/pnpm-store
    depends_on:
      - prometheus
    entrypoint:
      - "/bin/bash"
      - "-lc"
    command: "./scripts/docker-test-runner.sh"
    restart: 'no'

networks:
  default:
    driver: bridge

volumes:
  pnpm-store:
    driver: local
  grafana-storage:
    driver: local
  loki-data:
    driver: local
