---
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "nc"
        - "-z"
        - "localhost"
        - "2181"
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      # Two listeners: internal Docker network (PLAINTEXT)
      # and a host-reachable listener (HOST). Names must match
      # the value in KAFKA_LISTENERS.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,HOST://0.0.0.0:9093
      # Advertise the broker on the Compose network and also on the host
      # (host.docker.internal) so host-clients and Testcontainers can reach it.
      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:9092,
        HOST://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "${KAFKA_HOST_PORT:-9094}:9093"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "echo > /dev/tcp/localhost/9092 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "rabbitmq-diagnostics"
        - "status"
      interval: 10s
      timeout: 5s
      retries: 5

  bookkeeper:
    image: apachepulsar/pulsar-all:3.2.4
    command:
      - /bin/bash
      - -c
      - |
        bin/apply-config-from-env.py /pulsar/conf/bookkeeper.conf
        exec bin/bookkeeper bookie
    environment:
      - PULSAR_PREFIX_useHostNameAsBookieID=true
      - PULSAR_PREFIX_zkServers=zookeeper:2181
      - PULSAR_PREFIX_metadataServiceUri=zk+hierarchical://zookeeper:2181/ledgers
    ports:
      - "3181:3181"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:3181"
      interval: 15s
      timeout: 10s
      retries: 10

  pulsar:
    image: apachepulsar/pulsar:3.2.4
    command:
      - /bin/bash
      - -c
      - |
        bin/pulsar initialize-cluster-metadata \
          --cluster pulsar-cluster \
          --zookeeper zookeeper:2181 \
          --configuration-store zookeeper:2181 \
          --web-service-url http://pulsar:8080 \
          --broker-service-url pulsar://pulsar:6650 || true
        bin/pulsar broker
    environment:
      - PULSAR_MEM=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m
      - PULSAR_PREFIX_brokerServicePort=6650
      - PULSAR_PREFIX_webServicePort=8080
      - PULSAR_PREFIX_managedLedgerDefaultEnsembleSize=1
      - PULSAR_PREFIX_managedLedgerDefaultWriteQuorum=1
      - PULSAR_PREFIX_managedLedgerDefaultAckQuorum=1
      - PULSAR_PREFIX_bookkeeperMetadataServiceUri=zk+hierarchical://zookeeper:2181/ledgers
      - PULSAR_PREFIX_clusterName=pulsar-cluster
      - PULSAR_CLUSTER_NAME=pulsar-cluster
    depends_on:
      - zookeeper
      - bookkeeper
    ports:
      - "6650:6650"
      - "8085:8080"
    volumes:
      - ./broker.conf:/pulsar/conf/broker.conf:ro
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:8080/admin/v2/clusters"
      interval: 15s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "9000:9000"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:9000/minio/health/live"
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--spider"
        - "--quiet"
        - "http://localhost:9090/-/ready"
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:9.5.0
    ports:
      - "3005:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    depends_on:
      - prometheus
      - loki
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:3000/api/health"
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:2.8.2
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  data-generator:
    build:
      context: ../tools/data-generator
      dockerfile: Dockerfile
    image: phase2/data-generator:dev
    # persist logs from the container to host for inspection
    volumes:
      - ../tools/data-generator/logs:/var/lib/data-generator/logs
    ports:
      - "9100:9100"
    environment:
      - DIAG_RUN=false
      # optional: set DIAG_IPERF_TARGET to run iperf3 client when DIAG_RUN=true
      - DIAG_IPERF_TARGET=
      - SEGMENT_DISTRIBUTION=main:48,lbl:24,sba:21
    depends_on:
      - kafka
      - prometheus
    restart: unless-stopped

  java-ingest:
    build:
      context: ../tools/java-ingest
      dockerfile: Dockerfile
    image: phase2/java-ingest:dev
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MINIO_ENDPOINT=minio:9000
      - PROMETHEUS_ENDPOINT=prometheus:9090
      # Completes the pipeline: consumed Kafka events are forwarded to
      # the server API, which republishes them on the ingest SSE
      # channel. host.docker.internal reaches the SSR server on the host.
      - INGEST_FORWARD_URL=${INGEST_FORWARD_URL:-http://host.docker.internal:4000/api/ingest/events}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - kafka
      - minio
      - prometheus
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:8080/actuator/health"
      interval: 10s
      timeout: 5s
      retries: 5

  java-governance:
    build:
      context: ../apps/java-governance
      dockerfile: Dockerfile
    image: phase2/java-governance:dev
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker,kafka
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PULSAR_ADMIN_URL=http://pulsar:8080
      - PULSAR_BROKER_URL=pulsar://pulsar:6650
      - GOVERNANCE_MINIO_ENABLED=true
      - GOVERNANCE_MINIO_ENDPOINT=http://minio:9000
      - GOVERNANCE_MINIO_ACCESS_KEY=minio
      - GOVERNANCE_MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - GOVERNANCE_MINIO_BUCKET=governance
      - PROMETHEUS_ENDPOINT=prometheus:9090
      - PROMETHEUS_BASEURL=http://prometheus:9090
      - PROMETHEUS_BASE_URL=http://prometheus:9090
      # Ensure JVM system property is set so Spring reads prometheus.baseUrl
      - JAVA_TOOL_OPTIONS=-Dprometheus.baseUrl=http://prometheus:9090
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:8080/actuator/health"
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    restart: unless-stopped

  rabbitmq-exporter:
    image: ghcr.io/kbudde/rabbitmq_exporter:1.0.0-RC19
    environment:
      RABBIT_URL: http://rabbitmq:15672
      RABBIT_USER: guest
      RABBIT_PASSWORD: guest
      PUBLISH_PORT: 9419
      OUTPUT_FORMAT: JSON
    ports:
      - "9419:9419"
    depends_on:
      - rabbitmq
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    command:
      - --kafka.server=kafka:9092
    ports:
      - "9308:9308"
    depends_on:
      - kafka
    restart: unless-stopped

  nginx-static:
    image: nginx:stable
    ports:
      - "8080:80"
    volumes:
      - ../dist/apps/frontend/browser:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - prometheus
    restart: unless-stopped

  nginxlog-exporter:
    image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.11.0
    command:
      - -config-file
      - /etc/prometheus-nginxlog-exporter.hcl
    ports:
      - "4040:4040"
    volumes:
      - ./nginxlog-exporter.hcl:/etc/prometheus-nginxlog-exporter.hcl:ro
      - nginx-logs:/var/log/nginx:ro
    depends_on:
      - nginx-static
    restart: unless-stopped

  test-runner:
    image: node:20-bullseye
    profiles:
      - test
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
      - pnpm-store:/pnpm-store
    depends_on:
      - prometheus
    entrypoint:
      - "/bin/bash"
      - "-lc"
    command: "./scripts/docker-test-runner.sh"
    restart: "no"

  java-governance-test:
    image: maven:3.9.4-eclipse-temurin-21
    profiles:
      - test
    working_dir: /workspace
    env_file:
      - ../.env
    volumes:
      - ..:/workspace
      - ~/.m2:/root/.m2
    command:
      - mvn
      - -B
      - -Dsurefire.skipAfterFailureCount=3
      - -Dfailsafe.skipAfterFailureCount=3
      - -f
      - apps/java-governance/pom.xml
      - clean
      - verify
      - -Pwith-containers
    environment:
      - SPRING_PROFILES_ACTIVE=docker,kafka
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - HOST_KAFKA_BOOTSTRAP=kafka:9092
      - PULSAR_SERVICE_URL=pulsar://pulsar:6650
      - PULSAR_ADMIN_URL=http://pulsar:8080
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    depends_on:
      - kafka
      - pulsar
      - redis
      - minio
    restart: "no"

networks:
  default:
    driver: bridge

volumes:
  pnpm-store:
    driver: local
  grafana-storage:
    driver: local
  loki-data:
    driver: local
  nginx-logs:
    driver: local
