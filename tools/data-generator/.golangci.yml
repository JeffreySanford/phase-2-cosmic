---
# golangci-lint config
# for tools/data-generator
# Run locally: golangci-lint run ./...
# Install:     https://golangci-lint.run/usage/install/

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  # default: none means only explicitly listed linters run
  default: none
  enable:
    # Correctness
    # enforces checked error returns
    - errcheck
    # reports suspicious constructs (vet suite)
    - govet
    # SA/ST/QF checks from staticcheck.io
    - staticcheck
    # detects assignments whose value is never used
    - ineffassign
    # reports unused code
    - unused
    # Style / formatting (must match gofmt + goimports in CODING-STANDARDS.md)
    - gofmt
    - goimports
    # Safety patterns
    # checks HTTP response body is closed after use
    - bodyclose
    # checks for returning nil alongside a non-nil error
    - nilerr
    # OWASP-aligned security checks
    - gosec
    # Simplification
    - gosimple
formatters:
  goimports:
    # Separate internal module imports from stdlib/third-party
    local-prefixes: github.com/cosmic-horizon
  govet:
    enable:
      - shadow
  gosec:
    # Exclude informational findings that add noise without value
    excludes:
      # Errors unhandled - covered by errcheck
      - G104
      # File path provided as taint input - expected for CLI tools
      - G304

issues:
  # Do not limit output — show all findings
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Exclude test files from gosec and errcheck
    # (test code intentionally uses hardcoded values)
    - path: _test\.go
      linters:
        - gosec
        - errcheck
