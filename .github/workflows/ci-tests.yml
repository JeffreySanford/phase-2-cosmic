---
# yamllint disable=truthy,new-lines
name: Java CI - tests + preflight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-maven-image:
    name: Build Maven test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build local Maven test image
        uses: docker/build-push-action@v5
        with:
          context: tools/maven-test-image
          file: tools/maven-test-image/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          tags: |
            phase2/maven-test:17

  test-matrix:
    needs: [build-maven-image]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java:
          - 17
          - 21
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache pnpm store (node deps)
        uses: actions/cache@v4
        with:
          path: pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Run CI preflight (start/check Redis)
        run: |
          chmod +x ./scripts/ci/preflight.sh || true
          ./scripts/ci/preflight.sh

      - name: Start Java test dependencies
        run: |
          docker stop ci-redis || true
          docker compose -f docker/dev-compose.yml up -d zookeeper kafka rabbitmq redis

      - name: Run Maven tests (no skipping, with containers)
        # this execution includes the ProvenanceE2ETest added in Sprint 2
        env:
          USE_HOST_KAFKA: "true"
          HOST_KAFKA_BOOTSTRAP: "kafka:9092"
          KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
          SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
          SPRING_REDIS_HOST: "redis"
          SPRING_RABBITMQ_HOST: "rabbitmq"
        run: node ./scripts/mvn-wrapper-runner.js --use-compose -f apps/java-governance/pom.xml -B test -Pwith-containers

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java-governance
          path: apps/java-governance/target/surefire-reports || true

      - name: Run JS integration tests and simulator harness
        env:
          USE_HOST_KAFKA: "true"
          HOST_KAFKA_BOOTSTRAP: "kafka:9092"
          KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
          SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
          SPRING_REDIS_HOST: "redis"
          SPRING_RABBITMQ_HOST: "rabbitmq"
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm install --frozen-lockfile
          pnpm run ci:integration

      - name: Tear down compose
        if: always()
        run: docker compose -f docker/dev-compose.yml down --remove-orphans
