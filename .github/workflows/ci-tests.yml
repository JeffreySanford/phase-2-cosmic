---
# yamllint disable=truthy,new-lines
name: Java CI - tests + preflight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-maven-image:
    name: Build Maven test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build local Maven test image
        uses: docker/build-push-action@v5
        with:
          context: tools/maven-test-image
          file: tools/maven-test-image/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          tags: |
            phase2/maven-test:17

  test-matrix:
    needs: [build-maven-image]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java:
          - 17
          - 21
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache pnpm store (node deps)
        uses: actions/cache@v4
        with:
          path: pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Run CI preflight (start/check Redis)
        run: |
          chmod +x ./scripts/ci/preflight.sh || true
          ./scripts/ci/preflight.sh

      - name: Run Maven tests (no skipping, with containers)
        working-directory: apps/java-governance
        # this execution includes the ProvenanceE2ETest added in Sprint 2
        run: mvn -B test -Pwith-containers

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java-governance
          path: apps/java-governance/target/surefire-reports || true
