---
# yamllint disable=truthy,new-lines
name: Java CI - tests + preflight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-maven-image:
    name: Build Maven test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Maven test image
        uses: docker/build-push-action@v5
        with:
          context: tools/maven-test-image
          file: tools/maven-test-image/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          tags: |
            phase2/maven-test:17

  test-matrix:
    needs: [build-maven-image]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java:
          - 17
          - 21
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache pnpm store (node deps)
        uses: actions/cache@v4
        with:
          path: pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Run CI preflight (start/check Redis)
        run: |
          chmod +x ./scripts/ci/preflight.sh || true
          ./scripts/ci/preflight.sh

      - name: Start governance container (image is source-of-truth)
        run: |
          docker compose -f docker/dev-compose.yml pull java-governance || true
          docker compose -f docker/dev-compose.yml up -d --force-recreate --no-deps java-governance
          for i in {1..30}; do
            if curl -sSf http://localhost:8082/actuator/health; then
              echo "java-governance is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "java-governance failed to become healthy" && docker compose -f docker/dev-compose.yml logs java-governance || true ; exit 1

      - name: Note: no surefire reports for java-governance (image-based)
        run: echo "Governance is provided as a docker image; surefire artifacts are not produced in this workflow."
