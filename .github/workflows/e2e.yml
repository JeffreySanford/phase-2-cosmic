name: quality-ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Log in to Docker registry
        if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PAT != '' }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check:changed

      - name: Unit tests
        run: pnpm run unit-test

      - name: OpenAPI + fixture validation
        run: pnpm run openapi-validate

      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: E2E smoke
        run: pnpm run e2e-smoke

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Playwright E2E
        run: pnpm run e2e:playwright

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            dist/cypress
            cypress/screenshots
            cypress/videos

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
      - name: Save Playwright browser cache
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('**/package.json') }}
