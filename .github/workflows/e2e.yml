name: quality-ci

on:
  push:
  pull_request:

concurrency:
  # Supersede in-flight runs for the same PR so pushes do not stack a full
  # matrix each time. Never cancels main: a push to main must complete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
    steps:
      - uses: actions/checkout@v5
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Log in to Docker registry
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PAT != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PAT }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-binary-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            cypress-binary-${{ runner.os }}-

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check:changed

      - name: Run CI preflight (start/check Redis)
        run: |
          chmod +x ./scripts/ci/preflight.sh || true
          ./scripts/ci/preflight.sh

      - name: Unit tests
        run: |
          pnpm exec cross-env NX_NO_CLOUD=true pnpm nx run-many --target=test --projects=frontend,ui-theme --configuration=ci --parallel=false
          node ./scripts/mvn-wrapper-runner.js --use-compose -f apps/java-governance/pom.xml -T 1C test

      - name: OpenAPI + fixture validation
        run: pnpm run openapi-validate

      - name: Install Cypress binary
        run: pnpm exec cypress install
      - name: Disable Cypress cache during run
        run: |
          # ensure parallel jobs don't reuse cache to avoid flaky state
          echo "export CYPRESS_CACHE_FOLDER=/tmp/nonexistent" >> $GITHUB_ENV

      - name: E2E smoke
        run: pnpm run e2e-smoke

      - name: Storybook smoke
        run: pnpm exec nx run frontend:storybook --smoke-test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Playwright E2E
        run: pnpm run e2e:playwright

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-artifacts
          path: dist/cypress
          if-no-files-found: ignore

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts
          path: playwright-report
          if-no-files-found: ignore
      - name: Save Playwright browser cache
        if: always()
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('**/package.json') }}
