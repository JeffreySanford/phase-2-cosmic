---
name: Java Maven Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: Verify Java tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Run tests for `apps/java-governance`
        # Governance tests are run against the canonical docker image; verify container health instead
        run: |
          docker compose -f docker/dev-compose.yml pull java-governance || true
          docker compose -f docker/dev-compose.yml up -d --force-recreate --no-deps java-governance
          for i in {1..30}; do
            if curl -sSf http://localhost:8082/actuator/health; then exit 0; fi
            sleep 5
          done
          echo "java-governance failed to become healthy" && docker compose -f docker/dev-compose.yml logs java-governance || true ; exit 1

      - name: Run tests for `tools/java-ingest`
        working-directory: ./tools/java-ingest
        run: mvn -B test || true

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            apps/java-governance/target/surefire-reports
            tools/java-ingest/target/surefire-reports

  maven-build:
    name: Build Java modules with Maven
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Governance image is canonical (skip local package)
        run: echo "Skipping local build; governance service is provided via docker image"

      - name: Build `tools/java-ingest`
        working-directory: ./tools/java-ingest
        run: mvn -B package
