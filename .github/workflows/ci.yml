name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  openapi-validate:
    name: OpenAPI Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            openapi:
              - 'openapi/**'
            docs:
              - 'docuentation/**'

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        run: npm install -g pnpm@8

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run OpenAPI validation (capture logs)
        if: steps.filter.outputs.openapi == 'true' || steps.filter.outputs.docs == 'true'
        run: |
          set -o pipefail
          mkdir -p validation-output
          pnpm run openapi-validate > validation-output/openapi-validate.log 2>&1 || true
          # exit with non-zero if validation did not pass
          if grep -q "OpenAPI validation passed" validation-output/openapi-validate.log; then
            echo "OpenAPI validation succeeded"
            exit 0
          else
            echo "OpenAPI validation failed, see validation-output/openapi-validate.log"
            exit 1
          fi

      - name: Upload OpenAPI validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-validation-logs
          path: validation-output/**

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        run: npm install -g pnpm@8

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm -C apps/frontend build

      - name: Run java-governance unit tests (skip ITs)
        run: mvn -f apps/java-governance/pom.xml test -DskipITs

      - name: Archive surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: apps/java-governance/target/surefire-reports/**
