name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  openapi-validate:
    name: OpenAPI Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            openapi:
              - 'openapi/**'
            docs:
              - 'documentation/**'

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run OpenAPI validation (capture logs)
        if: steps.filter.outputs.openapi == 'true' || steps.filter.outputs.docs == 'true'
        run: |
          set -o pipefail
          mkdir -p validation-output
          pnpm run openapi-validate > validation-output/openapi-validate.log 2>&1 || true
          # exit with non-zero if validation did not pass
          if grep -q "OpenAPI validation passed" validation-output/openapi-validate.log; then
            echo "OpenAPI validation succeeded"
            exit 0
          else
            echo "OpenAPI validation failed, see validation-output/openapi-validate.log"
            exit 1
          fi

      - name: Upload OpenAPI validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-validation-logs
          path: validation-output/**

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm nx build frontend

      - name: Start java-governance container (image is source-of-truth)
        run: |
          docker compose -f docker/dev-compose.yml pull java-governance || true
          docker compose -f docker/dev-compose.yml up -d --force-recreate --no-deps java-governance
          # wait for health endpoint (max ~150s)
          for i in {1..30}; do
            if curl -sSf http://localhost:8082/actuator/health; then
              echo "java-governance is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "java-governance failed to become healthy" && docker compose -f docker/dev-compose.yml logs java-governance || true ; exit 1

      - name: Run java-ingest verify (unit)
        run: mvn -f tools/java-ingest/pom.xml clean verify -B

      - name: Archive java-ingest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-ingest-reports
          path: |
            tools/java-ingest/target/surefire-reports/**

  docs-lint:
    name: Docs Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run docs validation
        run: bash scripts/check-docs.sh

      # No surefire reports for java-governance when the service is provided as a docker image.
