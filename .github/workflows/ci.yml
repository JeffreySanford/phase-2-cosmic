name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  openapi-validate:
    name: OpenAPI Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            openapi:
              - 'openapi/**'
            docs:
              - 'docuentation/**'

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run OpenAPI validation (capture logs)
        if: steps.filter.outputs.openapi == 'true' || steps.filter.outputs.docs == 'true'
        run: |
          set -o pipefail
          mkdir -p validation-output
          pnpm run openapi-validate > validation-output/openapi-validate.log 2>&1 || true
          # exit with non-zero if validation did not pass
          if grep -q "OpenAPI validation passed" validation-output/openapi-validate.log; then
            echo "OpenAPI validation succeeded"
            exit 0
          else
            echo "OpenAPI validation failed, see validation-output/openapi-validate.log"
            exit 1
          fi

      - name: Upload OpenAPI validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-validation-logs
          path: validation-output/**
          if-no-files-found: ignore

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Nx dependency graph
        run: bash scripts/check-dep-graph.sh

      - name: Build frontend
        run: pnpm nx run frontend:build

      - name: Run frontend unit tests with coverage
        run: pnpm exec cross-env NX_NO_CLOUD=true pnpm nx run-many --target=test --projects=frontend,ui-theme --configuration=ci --parallel=false

      - name: Run java-governance verify (unit + IT)
        run: |
          mvn -f apps/java-governance/pom.xml clean verify -Pwith-containers -B

      - name: Generate JaCoCo report
        run: mvn -f apps/java-governance/pom.xml jacoco:report

      - name: Run coverage enforcement
        run: bash scripts/check-coverage.sh 90

      - name: Archive JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-reports
          path: |
            apps/java-governance/target/surefire-reports/**
            apps/java-governance/target/failsafe-reports/**
            apps/java-governance/target/site/jacoco/**
          if-no-files-found: ignore

      - name: Run java-ingest verify (unit)
        run: mvn -f tools/java-ingest/pom.xml clean verify -B

      - name: Run java-ingest verify (container integration)
        run: mvn -f tools/java-ingest/pom.xml clean verify -Pwith-containers -B

      - name: Archive java-ingest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-ingest-reports
          path: |
            tools/java-ingest/target/surefire-reports/**
          if-no-files-found: ignore

      - name: Run Go unit tests (data-generator)
        run: sh ./scripts/test-go.sh

      - name: Run golangci-lint (Go static analysis)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.6
          working-directory: tools/data-generator
          args: --timeout=5m

      - name: Run Semgrep SAST (multi-language)
        run: |
          pip install semgrep --quiet
          semgrep scan \
            --config "r/java" \
            --config "r/go" \
            --config "r/javascript" \
            --severity ERROR \
            --error \
            --exclude "node_modules" \
            --exclude "pnpm-store" \
            --exclude "target" \
            --exclude "dist" \
            --exclude ".nx" \
            --exclude "coverage" \
            --jobs 4 \
            .

  docs-lint:
    name: Docs Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run docs validation
        run: bash scripts/check-docs.sh

      - name: Archive surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: apps/java-governance/target/surefire-reports/**
          if-no-files-found: ignore

  e2e-ci:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Nx E2E
        run: pnpm run e2e:ci
