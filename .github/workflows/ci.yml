name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  issues: write

jobs:
  openapi-validate:
    name: OpenAPI Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            openapi:
              - 'openapi/**'
            docs:
              - 'documentation/**'

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run OpenAPI validation (capture logs)
        if: steps.filter.outputs.openapi == 'true' || steps.filter.outputs.docs == 'true'
        run: |
          set -o pipefail
          mkdir -p validation-output
          pnpm run openapi-validate > validation-output/openapi-validate.log 2>&1 || true
          # exit with non-zero if validation did not pass
          if grep -q "OpenAPI validation passed" validation-output/openapi-validate.log; then
            echo "OpenAPI validation succeeded"
            exit 0
          else
            echo "OpenAPI validation failed, see validation-output/openapi-validate.log"
            exit 1
          fi

      - name: Upload OpenAPI validation logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openapi-validation-logs
          path: validation-output/**
          if-no-files-found: ignore

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Must satisfy the highest `go` directive across all workspace modules:
      # tools/data-generator requires 1.25.0 (pulled up by the Pulsar client)
      # and apps/cosmic-forge-fits-renderer-go requires 1.24.2.
      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: tools/data-generator/go.sum

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Nx dependency graph
        run: bash scripts/check-dep-graph.sh

      - name: Build frontend
        run: pnpm nx run frontend:build

      - name: Run frontend unit tests with coverage
        run: pnpm exec cross-env NX_NO_CLOUD=true pnpm nx run-many --target=test --projects=frontend,ui-theme --configuration=ci --parallel=false

      - name: Storybook smoke
        run: pnpm exec nx run frontend:storybook --smoke-test

      - name: Start Java test dependencies
        run: docker compose -f docker/dev-compose.yml up -d zookeeper kafka rabbitmq redis

      - name: Run java-governance verify (unit + IT)
        env:
          USE_HOST_KAFKA: "true"
          HOST_KAFKA_BOOTSTRAP: "kafka:9092"
          KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
          SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
          SPRING_REDIS_HOST: "redis"
          SPRING_RABBITMQ_HOST: "rabbitmq"
        run: |
          node ./scripts/mvn-wrapper-runner.js --use-compose -f apps/java-governance/pom.xml clean verify -Pwith-containers -B

      - name: Generate JaCoCo report
        env:
          USE_HOST_KAFKA: "true"
          HOST_KAFKA_BOOTSTRAP: "kafka:9092"
          KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
          SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
          SPRING_REDIS_HOST: "redis"
          SPRING_RABBITMQ_HOST: "rabbitmq"
        run: node ./scripts/mvn-wrapper-runner.js --use-compose -f apps/java-governance/pom.xml jacoco:report

      - name: Run coverage enforcement
        run: bash scripts/check-coverage.sh 90

      - name: Archive JVM test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: java-reports
          path: |
            apps/java-governance/target/surefire-reports/**
            apps/java-governance/target/failsafe-reports/**
            apps/java-governance/target/site/jacoco/**
          if-no-files-found: ignore

      - name: Run java-ingest verify (unit)
        run: node ./scripts/mvn-wrapper-runner.js --use-compose -f tools/java-ingest/pom.xml clean verify -B

      - name: Run java-ingest verify (container integration)
        run: node ./scripts/mvn-wrapper-runner.js --use-compose -f tools/java-ingest/pom.xml clean verify -Pwith-containers -B

      - name: Tear down compose
        if: always()
        run: docker compose -f docker/dev-compose.yml down --remove-orphans

      - name: Archive java-ingest reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: java-ingest-reports
          path: |
            tools/java-ingest/target/surefire-reports/**
          if-no-files-found: ignore

      - name: Run Go unit tests and vet (all Go modules)
        run: bash ./scripts/test-go.sh

      - name: Run stress-mode validation (CI)
        run: pnpm run validate:ci:stress
        env:
          # Ensure the stress harness uses docker worker mode in CI tests
          STRESS_USE_DOCKER_WORKERS: "true"
          # Build images so CI doesn’t depend on a pre-cached Docker image state.
          BUILD_IMAGES: "true"

      - name: Upload stress validation artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stress-validation-artifacts
          path: validation-output/**
          if-no-files-found: ignore

      - name: Create GitHub issue on stress validation failure
        if: failure() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueTitle = `Stress validation failed (run ${process.env.GITHUB_RUN_ID})`;
            const issueBody = `Stress validation step failed in workflow [${process.env.GITHUB_WORKFLOW}](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}).\n\nArtifacts are available as **stress-validation-artifacts** in the workflow run.\n\n**Branch**: ${process.env.GITHUB_REF} \n**Commit**: ${process.env.GITHUB_SHA}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['stress-validation-failure'],
              per_page: 100,
            });
            const already = existing.data.find(i => i.title === issueTitle);
            if (already) {
              console.log('Issue already exists:', already.html_url);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['stress-validation-failure'],
              });
              console.log('Created issue:', issue.data.html_url);
            }

      - name: Run golangci-lint (data-generator)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1.6
          working-directory: tools/data-generator
          args: --timeout=5m

      - name: Run golangci-lint (fits-renderer)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1.6
          working-directory: apps/cosmic-forge-fits-renderer-go
          args: --timeout=5m

      - name: Run Semgrep SAST (multi-language)
        run: |
          pip install semgrep --quiet
          semgrep scan \
            --config "r/java" \
            --config "r/go" \
            --config "r/javascript" \
            --severity ERROR \
            --error \
            --exclude "node_modules" \
            --exclude "pnpm-store" \
            --exclude "target" \
            --exclude "dist" \
            --exclude ".nx" \
            --exclude "coverage" \
            --exclude "coverage-report" \
            --exclude "gh-artifacts" \
            --jobs 4 \
            .

  docs-lint:
    name: Docs Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run docs validation
        run: bash scripts/check-docs.sh

      - name: Archive surefire reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports
          path: apps/java-governance/target/surefire-reports/**
          if-no-files-found: ignore

  lakehouse-mvp:
    name: Lakehouse PR41 MVP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Lakehouse MVP Python dependencies
        run: python -m pip install -r tools/lakehouse-mvp/requirements.txt

      - name: Run Lakehouse PR41 MVP gate (tiny profile)
        run: pnpm run lakehouse:pr41:mvp

      - name: Assert generated artifacts stay out of git
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated Lakehouse artifacts must not be tracked by git:"
            git status --porcelain
            exit 1
          fi
          echo "No generated Lakehouse artifacts were added to git"

      - name: Upload PR41 manifest
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lakehouse-pr41-manifest
          path: tmp/lakehouse/pr41-delta/manifest.json
          if-no-files-found: ignore

  e2e-ci:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Nx E2E
        run: pnpm run e2e:ci
