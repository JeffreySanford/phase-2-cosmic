name: Build and push Maven test image

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GHCR_NAMESPACE: jeffreysanford
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub (optional)
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR (multi-arch + manifest)
        if: ${{ env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == '' }}
        uses: docker/build-push-action@v5
        with:
          context: tools/maven-test-image
          file: tools/maven-test-image/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.GHCR_NAMESPACE }}/phase2-maven-test:17
            ghcr.io/${{ env.GHCR_NAMESPACE }}/phase2-maven-test:latest
            ghcr.io/${{ env.GHCR_NAMESPACE }}/phase2-maven-test:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image (Docker Hub + GHCR)
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v5
        with:
          context: tools/maven-test-image
          file: tools/maven-test-image/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            docker.io/phase2/maven-test:17
            docker.io/phase2/maven-test:latest
            docker.io/phase2/maven-test:${{ github.sha }}
            ghcr.io/${{ env.GHCR_NAMESPACE }}/phase2-maven-test:17
            ghcr.io/${{ env.GHCR_NAMESPACE }}/phase2-maven-test:latest
            ghcr.io/${{ env.GHCR_NAMESPACE }}/phase2-maven-test:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Publish release tags (when release published)
        if: ${{ github.event_name == 'release' && github.event.action == 'published' && env.DOCKERHUB_USERNAME == '' || github.event_name == 'release' && github.event.action == 'published' && env.DOCKERHUB_TOKEN == '' }}
        uses: docker/build-push-action@v5
        with:
          context: tools/maven-test-image
          file: tools/maven-test-image/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.GHCR_NAMESPACE }}/phase2-maven-test:${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Publish release tags (Docker Hub + GHCR)
        if: ${{ github.event_name == 'release' && github.event.action == 'published' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v5
        with:
          context: tools/maven-test-image
          file: tools/maven-test-image/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            docker.io/phase2/maven-test:${{ github.event.release.tag_name }}
            ghcr.io/${{ env.GHCR_NAMESPACE }}/phase2-maven-test:${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
