name: Nightly Integration

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Start governance container for nightly integration (image is source-of-truth)
        run: |
          docker compose -f docker/dev-compose.yml pull java-governance || true
          docker compose -f docker/dev-compose.yml up -d --force-recreate --no-deps java-governance
          for i in {1..30}; do
            if curl -sSf http://localhost:8082/actuator/health; then exit 0; fi
            sleep 5
          done
          echo "java-governance failed to become healthy" && docker compose -f docker/dev-compose.yml logs java-governance || true ; exit 1

    # NOTE: This job assumes the runner has Docker available and Testcontainers can talk to it.
    # On GitHub-hosted runners Testcontainers usually needs Docker-in-Docker or setup configured.
    # You may want to run this on a self-hosted runner with Docker (recommended), or adapt to start supporting services.
