name: Nightly Integration

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pnpm
        run: npm install -g pnpm@8

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests with containers (requires Docker accessible to runner)
        run: mvn -f apps/java-governance/pom.xml test -Pwith-containers

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-surefire-reports
          path: apps/java-governance/target/surefire-reports/**

    # NOTE: This job assumes the runner has Docker available and Testcontainers can talk to it.
    # On GitHub-hosted runners Testcontainers usually needs Docker-in-Docker or setup configured.
    # You may want to run this on a self-hosted runner with Docker (recommended), or adapt to start supporting services.
