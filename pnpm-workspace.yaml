---
packages:
  - "."
  - "apps/*"
  - "libs/*"
  - "tools/*"

# pnpm 10 blocks dependency lifecycle scripts unless explicitly approved.
# Keep this as the single source of truth for packages that require native
# binaries, optional native acceleration, or install-time setup.
allowBuilds:
  "@nestjs/core": true
  "@parcel/watcher": true
  "@swc/core": true
  cpu-features: true
  cypress: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  ssh2: true
  unrs-resolver: true
