<header class="app-header">
  <div class="left">
    <button class="menu-btn" (click)="onToggleSidebar()" aria-label="Toggle sidebar">☰</button>
    <div class="brand">Phase-2 Cosmic<span class="dot" aria-hidden="true"></span></div>
  </div>
  <div class="right">
    <button
      class="user-btn"
      mat-stroked-button
      [matMenuTriggerFor]="userMenu"
      aria-label="User menu"
    >
      👤
    </button>
  </div>
</header>

<mat-menu
  #userMenu="matMenu"
  xPosition="before"
  yPosition="below"
  panelClass="user-menu-panel"
  overlayPanelClass="user-menu-overlay"
>
  <button mat-menu-item class="user-menu-item">
    <span class="menu-item-content">
      <span class="menu-label">Profile</span>
      <span class="menu-meta">local</span>
    </span>
  </button>
  <button mat-menu-item class="user-menu-item" (click)="openSettingsModal()">
    <span class="menu-item-content">
      <span class="menu-label">Settings</span>
      <span class="menu-meta">modal</span>
    </span>
  </button>
  <button mat-menu-item class="user-menu-item" (click)="openVisualizations()">
    <span class="menu-item-content">
      <span class="menu-label">Visualizations</span>
      <span class="menu-meta">route</span>
    </span>
  </button>
  <button mat-menu-item class="user-menu-item">
    <span class="menu-item-content">
      <span class="menu-label">Theme</span>
      <span class="menu-meta">system</span>
    </span>
  </button>
  <button mat-menu-item class="user-menu-item">
    <span class="menu-item-content">
      <span class="menu-label">Sign out</span>
      <span class="menu-meta">local</span>
    </span>
  </button>
</mat-menu>
