<mat-card>
  <mat-card-title>Datasets</mat-card-title>
  <app-disclaimer-banner type="demo" [dismissible]="true" [ready]="initialLoadSettled"></app-disclaimer-banner>
  <mat-card-content>
    <div class="create-row">
      <mat-form-field appearance="fill">
        <mat-label>Name</mat-label>
        <input matInput [(ngModel)]="name" />
      </mat-form-field>
      <mat-form-field appearance="fill" class="flex-grow">
        <mat-label>Description</mat-label>
        <input matInput [(ngModel)]="description" />
      </mat-form-field>
      <button mat-flat-button color="primary" (click)="create()">Create</button>
    </div>

    <div *ngIf="datasets.length === 0">No datasets yet</div>

    <div class="dataset-grid">
      <div class="dataset-card" *ngFor="let d of datasets">
        <div class="card-header">
          <div>
            <div><strong>{{ d.name }}</strong></div>
            <div class="muted">{{ d.description }}</div>
          </div>
          <div class="muted">{{ d.createdAt | date:'short' }}</div>
        </div>

        <div class="section-spacing">
          <app-provenance-panel 
            [datasetId]="d.id"
            [provenance]="{
              workflow: d.workflow,
              jobId: d.jobId,
              sourceDatasetId: d.sourceDatasetId,
              processingTimestamp: d.processingTimestamp,
              parameters: d.parameters,
              ngvlaParams: d.ngvlaParams
            }">
          </app-provenance-panel>
        </div>

        <div class="section-spacing">
          <app-external-sources [sources]="externalSourcesFor(d)"></app-external-sources>
        </div>
      </div>
    </div>
  </mat-card-content>
</mat-card>
