<mat-card class="broker-card pulsar-status-card">
  <mat-card-title>Pulsar</mat-card-title>
  <mat-card-content>
    <div class="status-values">
      <span>Brokers: {{ status.brokers }}</span>
      <span>Topics: {{ status.topics }}</span>
      <span>Partitions: {{ status.partitions }}</span>
    </div>
  </mat-card-content>
</mat-card>
