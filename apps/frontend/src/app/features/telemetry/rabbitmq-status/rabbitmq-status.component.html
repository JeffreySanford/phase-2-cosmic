<mat-card class="broker-tile" [ngClass]="'tile-' + (status.status || 'unknown')">
  <div class="tile-head">
    <div class="tile-title">
      <mat-icon>hub</mat-icon>
      RabbitMQ
    </div>
    <div class="tile-status">{{ status.status }}</div>
  </div>
  <div class="tile-body">
    <div class="stat-row"><span class="stat-label">Connection</span><span class="stat-val">{{ status.connection }}</span></div>
    <div class="stat-row"><span class="stat-label">Queues</span><span class="stat-val">{{ getQueuesCount() }}</span></div>
    <div class="stat-row"><span class="stat-label">Exchanges</span><span class="stat-val">{{ getExchangesCount() }}</span></div>
  </div>
  <div class="tile-meta" *ngIf="status.error">
    <span class="tile-error">{{ status.error }}</span>
  </div>
</mat-card>
