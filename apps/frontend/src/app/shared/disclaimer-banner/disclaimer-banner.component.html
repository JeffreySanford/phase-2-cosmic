<div *ngIf="!dismissed" [class]="bannerClass" role="alert" attr.aria-label="{{type}} disclaimer">
  <div class="disclaimer-banner__content">
    <svg class="disclaimer-banner__icon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
    </svg>
    <span class="disclaimer-banner__text">{{ displayMessage }}</span>
  </div>
  <button
    *ngIf="dismissible"
    class="disclaimer-banner__dismiss"
    (click)="dismiss()"
    aria-label="Dismiss disclaimer"
    title="Dismiss">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
      <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
    </svg>
  </button>
</div>
