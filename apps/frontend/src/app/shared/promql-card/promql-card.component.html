<mat-card class="promql-card" [ngClass]="'tone-' + tone">
  <mat-card-title>{{ title }}</mat-card-title>
  <mat-card-content>
    <div class="profile">Load {{ profilePct }}%</div>
    <div class="value">{{ displayValue() }}</div>
    <svg *ngIf="path" class="spark" viewBox="0 0 140 32" preserveAspectRatio="none">
      <path [attr.d]="path" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <div class="meta">{{ query }}</div>
    <div class="meta" *ngIf="lastUpdated">Updated {{ lastUpdated | date:'mediumTime' }}</div>
    <div class="actions">
      <button mat-button (click)="refresh()" [disabled]="loading">Refresh</button>
    </div>
  </mat-card-content>
</mat-card>
