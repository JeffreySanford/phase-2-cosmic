<mat-card class="promql-card">
  <mat-card-title>{{ title }}</mat-card-title>
  <mat-card-content>
    <div class="value">{{ currentValue | number:'1.0-2' }}</div>
    <svg *ngIf="path" class="spark" viewBox="0 0 120 30" preserveAspectRatio="none">
      <path [attr.d]="path" stroke="#3f51b5" fill="none" stroke-width="1.5" />
    </svg>
    <div class="meta">{{ query }}</div>
    <div class="actions">
      <button mat-button (click)="refresh()" [disabled]="loading">Refresh</button>
    </div>
  </mat-card-content>
</mat-card>
