<div class="status-band" [ngClass]="'status-band--' + status.health" *ngIf="shouldShow">
  <div class="status-band__content">
    <mat-icon class="status-band__icon">{{ getIcon() }}</mat-icon>
    <span class="status-band__message">{{ getMessage() }}</span>
    <span class="status-band__timestamp">Last checked: {{ timestampDisplay }}</span>
    
    <div class="status-band__services" matTooltip="Service Health">
      <span class="status-badge" [class.status-badge--offline]="status.services.governance === 'offline'">
        Governance
      </span>
      <span class="status-badge" [class.status-badge--offline]="status.services.telemetry === 'offline'">
        Telemetry
      </span>
      <span class="status-badge" [class.status-badge--offline]="status.services.diagnostics === 'offline'">
        Diagnostics
      </span>
      <span
        *ngIf="stressActive"
        class="status-badge status-badge--stress"
        matTooltip="Stress mode is active: runtime load is being generated"
      >
        Stress {{ stressModeLabel }}
        <ng-container *ngIf="profilePct !== null">({{ profilePct }}%)</ng-container>
        <ng-container *ngIf="workerCount !== null"> - {{ workerCount }} workers</ng-container>
      </span>
      <span
        *ngIf="stressActive && profileNote"
        class="status-badge status-badge--stress"
        matTooltip="Stress profile note"
      >
        {{ profileNote }}
      </span>
    </div>
  </div>
</div>
