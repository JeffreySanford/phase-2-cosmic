## Test profile defaults to disable external infra auto-config to keep unit tests lightweight
governance.messaging.enabled=false
governance.auth.enabled=false
# Prevent Spring Boot from auto-configuring external brokers during unit tests
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
governance.audit.rabbit.enabled=false
governance.redis.enabled=false
