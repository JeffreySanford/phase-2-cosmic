---
openapi: 3.1.0
info:
  title: Cosmic Horizon Governance API
  version: 0.1.0
  description: |
    Canonical control-plane API for ingest metadata and job orchestration.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [Health]
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/ingest:
    post:
      operationId: postIngest
      tags: [Ingest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
      responses:
        "202":
          description: Ingest accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
  /api/v1/jobs:
    get:
      operationId: listJobs
      tags: [Jobs]
      parameters:
        - in: query
          name: workflow
          required: false
          schema:
            type: string
        - in: query
          name: state
          required: false
          description: >-
            Filter by job state. Allowed values: QUEUED, RUNNING,
            COMPLETED, FAILED, CANCELED, TIMED_OUT
          schema:
            type: string
            enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELED, TIMED_OUT]
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobStatusResponse"
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: submitJob
      tags: [Jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobSubmitRequest"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSubmitResponse"
        "400":
          description: Invalid request or payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/jobs/{id}:
    get:
      operationId: getJobStatus
      tags: [Jobs]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/jobs/{id}/transition:
    post:
      operationId: transitionJob
      tags: [Jobs]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobTransitionRequest"
      responses:
        "200":
          description: Job transitioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
        "400":
          description: Invalid transition request (bad state or semantics)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Version mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/jobs/{id}/cancel:
    post:
      operationId: cancelJob
      tags: [Jobs]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCancelRequest"
      responses:
        "200":
          description: Job canceled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/jobs/{id}/audit:
    get:
      operationId: getJobAudit
      tags: [Jobs]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: list of audit messages
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/v1/jobs/{id}/lineage:
    get:
      operationId: getJobLineage
      tags: [Jobs]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lineage metadata for job
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Lineage not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/jobs/{id}/retry:
    post:
      operationId: retryJob
      tags: [Jobs]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedVersion:
                  type: integer
      responses:
        "200":
          description: Job retried (state reset to QUEUED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
        "400":
          description: Cannot retry job in current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Version mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/vo/services:
    get:
      operationId: getVoServices
      tags: [VO]
      responses:
        "200":
          description: List of Virtual Observatory service endpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  tapUrl:
                    type: string
                    format: uri
                  dataLinkUrl:
                    type: string
                    format: uri

  # dataset endpoints
  /api/v1/datasets:
    get:
      operationId: listDatasets
      tags: [Datasets]
      responses:
        "200":
          description: List of datasets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatasetResponse"
    post:
      operationId: createDataset
      tags: [Datasets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetRequest"
      responses:
        "201":
          description: Dataset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/datasets/{id}:
    get:
      operationId: getDataset
      tags: [Datasets]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dataset details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetResponse"
        "404":
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/public-sources:
    get:
      operationId: listPublicSources
      tags: [Public]
      responses:
        "200":
          description: Curated list of public data sources
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    url:
                      type: string
                  required: [name, url]
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - timestamp
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
        timestamp:
          type: string
          format: date-time
    IngestRequest:
      type: object
      required:
        - source
        - eventType
        - payloadBytes
      properties:
        source:
          type: string
          minLength: 1
        eventType:
          type: string
          minLength: 1
        payloadBytes:
          type: integer
          minimum: 0
        traceId:
          type: string
      additionalProperties: false
    IngestResponse:
      type: object
      required:
        - ingestId
        - status
        - acceptedAt
      properties:
        ingestId:
          type: string
        status:
          type: string
          const: ACCEPTED
        acceptedAt:
          type: string
          format: date-time
    JobSubmitRequest:
      type: object
      required:
        - workflow
        - datasetId
      properties:
        workflow:
          type: string
          minLength: 1
        datasetId:
          type: string
          minLength: 1
        parameters:
          type: object
          additionalProperties: true
        lineage:
          type: object
          description: "Optional lineage metadata stored in job parameters."
          additionalProperties: true
        manifest:
          $ref: "#/components/schemas/Manifest"
        details:
          type: object
          description: >-
            Optional event payload details for broker-driven submissions.
          additionalProperties: true
        ngvlaParams:
          $ref: "#/components/schemas/NgvlaObservationParams"
        requestedBy:
          type: string
      additionalProperties: false
    JobSubmitResponse:
      type: object
      required:
        - jobId
        - status
        - queuedAt
      properties:
        jobId:
          type: string
        status:
          type: string
          enum:
            - QUEUED
            - RUNNING
            - COMPLETED
            - FAILED
            - CANCELED
            - TIMED_OUT
        queuedAt:
          type: string
          format: date-time
    JobStatusResponse:
      type: object
      required:
        - jobId
        - workflow
        - datasetId
        - status
        - createdAt
        - updatedAt
        - version
      properties:
        jobId:
          type: string
        workflow:
          type: string
        datasetId:
          type: string
        status:
          type: string
          enum:
            - QUEUED
            - RUNNING
            - COMPLETED
            - FAILED
            - CANCELED
            - TIMED_OUT
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        parameters:
          type: object
          additionalProperties: true
        lineage:
          type: object
          description: "Optional lineage metadata stored in job parameters."
          additionalProperties: true
        manifest:
          $ref: "#/components/schemas/Manifest"
        requestedBy:
          type: string
        version:
          type: integer
          minimum: 0
    JobTransitionRequest:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELED, TIMED_OUT]
        expectedVersion:
          type: integer
          minimum: 1
    JobCancelRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: true
      properties:
        error:
          type: string
        jobId:
          type: string
        currentVersion:
          type: integer
