springdoc.swagger-ui.urls[0].name=Governance
springdoc.swagger-ui.urls[0].url=/openapi/governance.yaml
springdoc.swagger-ui.urls[0].description=Canonical Governance API
springdoc.swagger-ui.path=/swagger-ui.html
# Redis defaults for local dev/docker
# Spring Boot 3 binds Redis client settings under spring.data.redis.*.
spring.data.redis.host=${SPRING_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

server.port=8080
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true

# toggle lightweight auth filter; set true in production to require an Authorization header
# (dev mode leaves this unset/false so requests pass through)
governance.auth.enabled=${GOVERNANCE_AUTH_ENABLED:false}

# Development defaults for Virtual Observatory endpoints used by frontend diagnostics
# Override with environment variables or a production config as needed.
governance.vo.tap-url=${GOVERNANCE_VO_TAP_URL:https://heasarc.gsfc.nasa.gov/xamin/vo/tap}
governance.vo.data-link-url=${GOVERNANCE_VO_DATALINK_URL:https://heasarc.gsfc.nasa.gov/xamin/vo/datalink}

governance.minio.enabled=${GOVERNANCE_MINIO_ENABLED:true}
governance.minio.endpoint=${GOVERNANCE_MINIO_ENDPOINT:http://localhost:9000}
governance.minio.access-key=${GOVERNANCE_MINIO_ACCESS_KEY:minio}
governance.minio.secret-key=${GOVERNANCE_MINIO_SECRET_KEY:minio123}
governance.minio.bucket=${GOVERNANCE_MINIO_BUCKET:governance}

# Whether an ingested broker message also becomes a governance job.
# Off by default: the dev data generator emits ~244 records/sec into
# phase2-events and never stops, which fills the job store at roughly
# 880k records/hour from background traffic alone. Ingest still receives,
# validates and measures every message either way, so the streaming path
# and its topology metrics stay instrumented. Turn on deliberately to
# demonstrate or load-test the broker-to-job path.
governance.ingest.create-jobs=${GOVERNANCE_INGEST_CREATE_JOBS:false}

# How long a broker-derived job survives. ISO-8601 duration; PT0S disables.
# These jobs are generated rather than requested and arrive for as long as the
# stack is up, so they are given a lifetime instead of accumulating. Operator
# submitted jobs are untouched and keep no expiry: governance stays their
# system of record.
governance.ingest.job-retention=${GOVERNANCE_INGEST_JOB_RETENTION:PT6H}
