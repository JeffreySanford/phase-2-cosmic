springdoc.swagger-ui.urls[0].name=Governance
springdoc.swagger-ui.urls[0].url=/openapi/governance.yaml
springdoc.swagger-ui.urls[0].description=Canonical Governance API
springdoc.swagger-ui.path=/swagger-ui.html
# Redis defaults for local dev/docker
# Spring Boot 3 binds Redis client settings under spring.data.redis.*.
# Use nested fallback so either SPRING_REDIS_HOST or REDIS_HOST (or default)
# will be respected when the JVM starts inside Docker.
spring.data.redis.host=${SPRING_REDIS_HOST:${REDIS_HOST:redis}}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

# Also set legacy spring.redis.* keys to the same nested-defaults so clients
# or custom config that read the older keys still use the compose host.
spring.redis.host=${SPRING_REDIS_HOST:${REDIS_HOST:redis}}
spring.redis.port=${SPRING_REDIS_PORT:6379}
server.port=8080
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true

# toggle lightweight auth filter; set true in production to require an Authorization header
# (dev mode leaves this unset/false so requests pass through)
governance.auth.enabled=${GOVERNANCE_AUTH_ENABLED:false}
