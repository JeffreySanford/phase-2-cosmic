---
openapi: 3.1.0
info:
  title: Cosmic Horizon Governance API
  version: 0.1.0
  description: |
    Canonical control-plane API for ingest metadata and job orchestration.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [Health]
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/ingest:
    post:
      operationId: postIngest
      tags: [Ingest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
      responses:
        "202":
          description: Ingest accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
  /api/v1/jobs:
    get:
      operationId: listJobs
      tags: [Jobs]
      parameters:
        - in: query
          name: workflow
          required: false
          schema:
            type: string
        - in: query
          name: state
          required: false
          description: >-
            Filter by job state. Allowed values: QUEUED, RUNNING,
            COMPLETED, FAILED, CANCELED, TIMED_OUT
          schema:
            type: string
            enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELED, TIMED_OUT]
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobStatusResponse"

components:
  schemas:
    SchedulingBlock:
      $ref: '../apps/java-governance/src/main/resources/schemas/trident.scheduling-block.json'
    ExecutionBlock:
      $ref: '../apps/java-governance/src/main/resources/schemas/trident.execution-block.json'
    SubarrayConfiguration:
      $ref: '../apps/java-governance/src/main/resources/schemas/trident.subarray-configuration.json'
    SpectralConfiguration:
      $ref: '../apps/java-governance/src/main/resources/schemas/trident.spectral-configuration.json'
    FspAllocationPlan:
      $ref: '../apps/java-governance/src/main/resources/schemas/trident.fsp-allocation-plan.json'
